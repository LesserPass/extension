<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		<title>LesserPass</title>
		<link rel="stylesheet" href="popup.css">
		<script src="popup.js" defer></script>
	</head>
	<body class="flex-top-bottom">
		<!-- <div class="tooltip">Index (Scroll to change)</div> -->
		<!-- Overlay -- copied -->
		<div id="copyOverlay" class="flex-top-bottom nslct">
			<h1>Copied!</h1>
		</div>
		<!-- Header -->
		<div class="header flex-top-bottom nslct">
			<h2>LesserPass</h2>
		</div>
		<div class="tabToggle nslct">
			<input id="tabToggleInput" type="checkbox"/>
			<!-- This element is used to create the toggle switch effect using shadow bs -->
			<label></label>
		</div>
		<!-- --- -->
		<div id="passTab" class="flex-top-bottom">
			<input placeholder="Site" id="site" type="text" >
			<input placeholder="Login" id="login" type="text" >
			<div class="passwordInput flex-side-side">
				<input id="masterpw" placeholder="Master Password" type="password">
				<ol id="passMojiContainer" class="flex-side-side nslct">
					<li class="emoji">-</li>
					<li class="emoji">-</li>
					<li class="emoji">-</li>
				</ol>
			</div>

			<div class="quickNumbers">
				<div class="numberSettingContainer">
					<button class="numberInputButton minus nslct" id="minusLength">-</button>
					<input id="LengthInput" type="number" min="1" placeholder="Length">
					<button class="numberInputButton plus nslct" id="plusLength">+</button>
				</div>
				<div class="numberSettingContainer">
					<button class="numberInputButton minus nslct" id="minusIndex">-</button>
					<input id="IndexInput" type="number" min="1" placeholder="Index">
					<button class="numberInputButton plus nslct" id="plusIndex">+</button>
				</div>
			</div>
			<details class="quickFilters nslct">
				<summary>
					Open filters
				</summary>
				<div class="filterContainer">
					<div class="flex-top-bottom">
						<h3 class="filterLabel">a-z</h3>
						<input type="checkbox" class="ctm-checkbox" id="filterLowers" checked></div>
					<div class="flex-top-bottom">
						<h3 class="filterLabel">A-Z</h3>
						<input type="checkbox" class="ctm-checkbox" id="filterCaps" checked></div>
					<div class="flex-top-bottom">
						<h3 class="filterLabel">0-9</h3>
						<input type="checkbox" class="ctm-checkbox" id="filterNumbers" checked></div>
					<div class="flex-top-bottom">
						<h3 class="filterLabel">!$?</h3>
						<input type="checkbox" class="ctm-checkbox" id="filterSymbols" checked></div>
				</div>
			</details>
			<div class="outputContainer flex-side-side">
				<input title="Click to copy" id="pwOutput" type="password" readonly>
				<button id="toggleView" class="flex-top-bottom nslct">
					<img id="toggleViewImage" src="../assets/icons/eye.svg" alt="Toggle View">
				</button>
			</div>
		</div>














		<!-- --- -->
		<div id="mfaTab" class="flex-top-bottom hideThisTab">
				<!-- prob add passmoji stuff to this one again -->
				<input type="password" id="decryptMFAInput" placeholder="Enter password to decrypt">
				<ul id="mfaList">

					<li class="mfaEntry">
							<details>
								<summary id="mfaTimerDiv">
									<img src="https://icons.duckduckgo.com/ip3/github.com.ico"
										style="max-height: 16px; aspect-ratio: 1;"
										alt="github.com" class="mfaIcon">
									<h3 class="mfaLabel">Github (user defined)</h3>
								</summary>
								<input type="text" id="mfaOutput" readonly>
								<!-- ideally id  show the next valid code but idk where ui wise :c -->
								 <!-- Idea: instead just add a setting to cut off old codes early. If the code has XYZ seconds of being valid left show the next one -->
								<button class="copybutton">
									<img src="../assets/icons/copy.svg" alt="">
								</button>
							</details>
					</li>

				</ul>
				<button class="addMFA">ADD</button>
		</div>












		<div class="footer flex-side-side nslct">
			<a href="../settings/settings.html" target="_blank">Settings</a>
			<a id="version" href="../changelog/changelog.html" target="_blank">{version}</a>
			<a href="https://github.com/Xeimyn/LesserPass" target="_blank">Source</a>
		</div>
	</body>
	</html>
